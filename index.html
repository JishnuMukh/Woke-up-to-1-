<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Last 1% Battery</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="intro-card">
    <p class="warning">⚠ LOW BATTERY WARNING ⚠</p>

    <h1>THE LAST<br>1%</h1>
    <p class="subtitle">BATTERY GAME</p>

    <div class="battery" aria-label="Battery level: 1 percent">
      <div class="battery-fill"></div>
    </div>

    <p class="battery-number">1%</p>
    <p class="tagline">LOW BATTERY. HIGH DRAMA.</p>

    <section class="story">
      <p>It is <strong>8:03 AM.</strong></p>
      <p>Your charger is missing.</p>
      <p>Your phone is at 1%.</p>
      <p>You have places to be.</p>
    </section>

    <button id="start-button">START SURVIVING</button>

    <p class="tip">Every decision has consequences.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
